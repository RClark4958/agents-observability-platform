# Add-on merged over base.yaml when OTEL_EXTRA_CONFIG=langsmith.yaml (just up-cloud).
# Lists are replaced, not appended, on merge, so the full exporter list is restated here.

exporters:
  otlp_http/langsmith:
    endpoint: https://api.smith.langchain.com/otel
    headers:
      x-api-key: "${env:LANGSMITH_API_KEY}"
      Langsmith-Project: "${env:LANGSMITH_PROJECT}"

service:
  pipelines:
    traces:
      exporters: [otlp_http/langfuse, otlp_http/phoenix, otlp_grpc/tempo, otlp_http/langsmith, debug]
