[project]
name = "payerbench"
version = "0.1.0"
description = "Synthetic health-plan member-services agent instrumented with OpenTelemetry GenAI semantic conventions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rick Clark" }]
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.7",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "openinference-instrumentation-langchain>=0.1.40",
    "faker>=30",
    "typer>=0.12",
    "rich>=13",
    "anthropic>=1.0",
    "openai>=1.50",
]

[project.optional-dependencies]
# PHI redaction layer 2: Presidio + the spaCy large English model (~600 MB). Optional so CI and
# lightweight installs stay small; `uv sync --extra redact` enables it. PAYERBENCH_PRESIDIO=auto
# turns the layer on whenever these are importable.
redact = [
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[project.scripts]
payerbench = "payerbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The spaCy model in the `redact` extra is a direct wheel URL (it is not on PyPI).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/payerbench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
